name: Deploy Encounter Workbench

# Builds the Encounter Workbench (web/) and publishes it to GitHub Pages after
# every merge to main, so it is playable from any device, including an iPad on
# mobile connectivity. Validation belongs to the pull-request workflow and is
# intentionally not repeated here.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions",
# and the auto-created github-pages environment must allow this branch under
# Settings -> Environments -> github-pages -> Deployment branches.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo>/.
          VITE_BASE: /webgame/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
