name: Deploy Encounter Workbench

# Builds the Encounter Workbench (web/) and publishes it to GitHub Pages so
# it is playable from any device, including an iPad on mobile connectivity.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/web-game-loop-framework-73gyg8
    paths:
      - 'web/**'
      - 'data/**'
      - '.github/workflows/deploy-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo>/.
          VITE_BASE: /webgame/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
