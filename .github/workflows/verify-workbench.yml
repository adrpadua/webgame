name: Verify Encounter Workbench

# The pre-merge gate for web/. Runs the Vitest suite, the lint pass (which
# includes the engine-purity boundary rule), and the browser smoke suite —
# the only coverage for the 390x844 portrait contract, the 44px target
# contract, and deterministic record replay through a real browser.
#
# The smoke suite lives here rather than in deploy-workbench.yml because that
# workflow runs only after a merge to main; a portrait regression caught there
# is already on the default branch.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'data/**'
      - '.github/workflows/verify-workbench.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'data/**'
      - '.github/workflows/verify-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      # No VITE_BASE here on purpose. The Pages build sets it to /webgame/,
      # which makes `vite preview` serve from that sub-path; the smoke suite
      # drives http://localhost:4173/ and would 404 against such a build.
      - name: Build
        working-directory: web
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Smoke
        working-directory: web
        run: node scripts/smoke.mjs
