name: Verify Encounter Workbench

# The pre-merge gate for the repository. Runs the Vitest suite, the mutation
# audit, the lint pass (which includes the engine-purity boundary rule), and
# the build.
#
# The browser smoke suite is deliberately NOT here. It needs a Chromium, and
# `playwright install --with-deps` shells out to apt-get on a hosted runner:
# on 2026-08-18 that wedged three runs in a row for 14 to 24 minutes each, and
# it went on doing it after a 10-minute bound was added — the bound only
# converted a hang into a red check. Every one of those failures was the
# Ubuntu mirror, never the diff, which is the worst kind of gate: it fails for
# reasons the author cannot act on and teaches everyone to ignore it.
#
# The suite still runs, and still gates a pull request — it runs locally
# before one is opened. `npm run verify:local` is the whole gate, and
# `web/scripts/install-hooks.sh` installs it as a pre-push hook so it is hard
# to skip by accident. What CI keeps is everything that needs no browser, and
# those steps are fast and honest.
#
# Automatic validation runs only for pull requests. Merges to main are assumed
# to have passed this gate, so deploy-workbench.yml does not repeat the suite.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      # A green suite says nothing about which rules it guards. This
      # reintroduces each documented rule's defect one at a time and fails if
      # the suite does not notice — the first run found four rules that were
      # documented, implemented, and unasserted, one of them behind a test that
      # walked a whole fight without ever reaching the branch it existed for.
      # Runs the suite once per entry, so it is the slowest step here by design.
      - name: Mutation audit
        working-directory: web
        run: npm run mutate

      - name: Lint
        working-directory: web
        run: npm run lint

      # No VITE_BASE here on purpose. The Pages build sets it to /webgame/,
      # which makes `vite preview` serve from that sub-path; the smoke suite
      # drives http://localhost:4173/ and would 404 against such a build.
      - name: Build
        working-directory: web
        run: npm run build

