name: Verify Encounter Workbench

# The pre-merge gate for the repository. Runs the Vitest suite, the mutation
# audit, the lint pass (which includes the engine-purity boundary rule), and
# the build.
#
# The browser smoke suite runs in the `smoke` job below, on a self-hosted
# runner with Chromium already installed. It is not on a hosted runner because
# `playwright install --with-deps` shells out to apt-get there: on 2026-08-18
# that wedged three runs in a row for 14 to 24 minutes each, and went on doing
# it after a 10-minute bound was added — the bound only converted a hang into
# a red check. Every one of those failures was the Ubuntu mirror, never the
# diff, which is the worst kind of gate: it fails for reasons the author
# cannot act on and teaches everyone to ignore it.
#
# The same suite also runs locally on push, through the pre-push hook
# `web/scripts/install-hooks.sh` installs. That is deliberate belt and braces:
# a self-hosted runner is a machine that can be off, and the hook means a
# pull request was verified once before it existed.
#
# Automatic validation runs only for pull requests. Merges to main are assumed
# to have passed this gate, so deploy-workbench.yml does not repeat the suite.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      # A green suite says nothing about which rules it guards. This
      # reintroduces each documented rule's defect one at a time and fails if
      # the suite does not notice — the first run found four rules that were
      # documented, implemented, and unasserted, one of them behind a test that
      # walked a whole fight without ever reaching the branch it existed for.
      # Runs the suite once per entry, so it is the slowest step here by design.
      - name: Mutation audit
        working-directory: web
        run: npm run mutate

      - name: Lint
        working-directory: web
        run: npm run lint

      # No VITE_BASE here on purpose. The Pages build sets it to /webgame/,
      # which makes `vite preview` serve from that sub-path; the smoke suite
      # drives http://localhost:4173/ and would 404 against such a build.
      - name: Build
        working-directory: web
        run: npm run build

  # The browser half, on hardware that already has a browser.
  #
  # `web/scripts/setup-local-runner.sh` registers a machine with the
  # `playwright` label and installs Chromium on it once, so nothing here
  # downloads a browser or touches a package manager.
  #
  # Two conditions, for two different reasons.
  #
  # `vars.SELF_HOSTED_SMOKE` is the switch. A job whose runner labels match no
  # registered runner does not fail fast — it sits QUEUED for 24 hours and then
  # fails, and `timeout-minutes` cannot shorten that because it bounds
  # execution, not queueing. So the job asks whether a runner is supposed to
  # exist before requesting one. `web/scripts/setup-local-runner.sh` sets the
  # variable at the end of a successful run, which is also what lets this
  # workflow land before any runner exists. Unset it if the machine goes away
  # for a while; the pre-push hook still runs the same suite, so the contract
  # is checked either way.
  #
  # The head-repository check is a security boundary rather than a switch. This
  # repository is public and a self-hosted runner executes jobs on someone's
  # own machine, so a pull request opened from a fork must never reach it. A
  # skipped job reports success, so a fork PR is still reviewable — it just
  # never earns the browser gate on someone else's hardware. Repository
  # settings should also require approval for outside collaborators; this line
  # is what holds if that is ever loosened.
  smoke:
    needs: verify
    if: >-
      vars.SELF_HOSTED_SMOKE == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, playwright]
    # Bounds a hung run — a wedged browser, a suite that stops making progress.
    # It does not bound queueing; the variable above is what covers that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # A self-hosted runner is a machine someone can reimage, and a Playwright
      # bump moves which build the suite needs. Either way, say so in one line
      # naming the fix rather than failing inside Playwright with a stack trace
      # about an executable path.
      - name: Check Chromium is baked in
        working-directory: web
        run: node scripts/check-browser.mjs

      - name: Build
        working-directory: web
        run: npm run build

      - name: Smoke
        working-directory: web
        run: node scripts/smoke.mjs
