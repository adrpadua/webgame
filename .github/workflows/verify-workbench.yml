name: Verify Encounter Workbench

# The pre-merge gate for the repository. Runs the Vitest suite, the lint pass (which
# includes the engine-purity boundary rule), and the browser smoke suite —
# the only coverage for the 390x844 portrait contract, the 44px target
# contract, and deterministic record replay through a real browser.
#
# Automatic validation runs only for pull requests. Merges to main are assumed
# to have passed this gate, so deploy-workbench.yml does not repeat the suite.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      # No VITE_BASE here on purpose. The Pages build sets it to /webgame/,
      # which makes `vite preview` serve from that sub-path; the smoke suite
      # drives http://localhost:4173/ and would 404 against such a build.
      - name: Build
        working-directory: web
        run: npm run build

      # What is cached is a browser build, and the only thing that decides
      # which build that is, is Playwright's own version. Keying on the
      # lockfile hash threw the cache away whenever anything else in it moved
      # — merging main into a branch was enough — so the branch that had just
      # done so paid a cold install while main, one commit behind, did not.
      - name: Resolve Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` shells out to apt-get, and on 2026-08-18 that wedged
      # three runs in a row for 14 to 24 minutes each. A step with no bound of
      # its own inherits the job's, which is six hours, so a hung install
      # reads as a slow one until someone gives up waiting. Ten minutes is
      # several times the cold-install cost and well clear of a cache hit.
      - name: Install Chromium
        working-directory: web
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Smoke
        working-directory: web
        run: node scripts/smoke.mjs
