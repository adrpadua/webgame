<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      .card { width: 560px; }
      
    </style>
  </head>
  <body>
    <div class="card"><div class="warn">Not narrowed. Spacing inherits Tailwind's default scale wholesale; nothing in the canon says which steps are legal, and arbitrary values (<span class="mono">gap-[2px]</span>, <span class="mono">gap-[3px]</span>) have crept in beside them. These are the steps in live use.</div><div class="grid" style="align-items:flex-end"><div class="swatch" style="align-items:center"><div style="width:22px;height:4px;background:var(--gold-500);border-radius:2px"></div><div class="mono">1 · 4</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:6px;background:var(--gold-500);border-radius:2px"></div><div class="mono">1.5 · 6</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:8px;background:var(--gold-500);border-radius:2px"></div><div class="mono">2 · 8</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:10px;background:var(--gold-500);border-radius:2px"></div><div class="mono">2.5 · 10</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:12px;background:var(--gold-500);border-radius:2px"></div><div class="mono">3 · 12</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:16px;background:var(--gold-500);border-radius:2px"></div><div class="mono">4 · 16</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:24px;background:var(--gold-500);border-radius:2px"></div><div class="mono">6 · 24</div></div><div class="swatch" style="align-items:center"><div style="width:22px;height:32px;background:var(--gold-500);border-radius:2px"></div><div class="mono">8 · 32</div></div></div></div>
  </body>
</html>
